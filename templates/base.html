<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page_title }} — Verifix Mock-Stand</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
  <link rel="stylesheet" href="/static/tour/verifix-tour.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar__brand">
      <span class="topbar__logo">V</span>
      <span class="topbar__name">VERIFIX</span>
    </div>

    <nav class="topnav">
      {% for section in menu %}
      <div class="topnav__item {{ 'is-active-section' if section.label == current_section }}">
        <span class="topnav__label">{{ section.label }}</span>
        <div class="topnav__dropdown {{ 'topnav__dropdown--cols' if section.columns|length > 1 else '' }}">
          {% for col in section.columns %}
          <div class="topnav__col">
            {% if col.title %}<div class="topnav__col-title">{{ col.title }}</div>{% endif %}
            {% for path, label, functional in col.links %}
            <a href="{{ path }}" class="topnav__link {{ 'is-active' if path == current_path else '' }} {{ '' if functional else 'is-stub' }}">{{ label }}</a>
            {% endfor %}
          </div>
          {% endfor %}
        </div>
      </div>
      {% endfor %}
    </nav>

    <div class="topbar__right">
      <span class="topbar__mock-badge" title="Это учебная копия, не настоящий Verifix">MOCK</span>
      <span class="topbar__org">{{ org_id[:8] }}…</span>
    </div>
  </header>

  <main class="content-full">
    {% block content %}{% endblock %}
  </main>

  <script src="/static/tour/verifix-tour.js"></script>
  <script src="/static/tour/steps.js"></script>
  <script>
    VerifixTour.start(VERIFIX_TOUR_STEPS, {
      title: 'Настройка Verifix',
      doneText: 'Оба JTBD пройдены — структура готова и первый отчёт по часам построен.',
      intro: {
        title: 'Добро пожаловать в песочницу Verifix',
        text: 'Это учебная копия интерфейса — здесь можно потренироваться в настройке без риска сломать боевые данные. Проведём по шагам: от подразделений до первого отчёта по отработанным часам.',
        cta: 'Начать настройку',
      },
    });
  </script>
</body>
</html>
